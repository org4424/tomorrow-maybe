<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>tomorrow maybe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background:#081a2b;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:20px;
    }
    input, button, select {
      padding:10px;
      margin:5px;
      font-size:16px;
    }
    button {
      background:#2196f3;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }
    button.red {
      background:#e53935;
    }
    .slots button {
      margin:4px;
    }
  </style>
</head>
<body>

<h1>tomorrow maybe</h1>
<p>קביעת תור ליובל</p>

<input id="username" placeholder="שם מלא">

<br><br>

<input type="date" id="date">

<br><br>

<button onclick="loadSlots()">טען שעות</button>

<div class="slots" id="slots"></div>

<br>

<button onclick="book()">קבע תור</button>

<hr>

<h3>ביטול תור</h3>
<button class="red" onclick="cancel()">בטל תור</button>

<script>
let selectedTime = null;

function loadSlots() {
  const date = document.getElementById("date").value;
  fetch(`/api/available?date=${date}`)
    .then(r => r.json())
    .then(times => {
      const div = document.getElementById("slots");
      div.innerHTML = "";
      selectedTime = null;

      times.forEach(t => {
        const b = document.createElement("button");
        b.innerText = t;
        b.onclick = () => {
          selectedTime = t;
          document.querySelectorAll(".slots button").forEach(x => x.style.background="#2196f3");
          b.style.background = "#4caf50";
        };
        div.appendChild(b);
      });
    });
}

function book() {
  fetch("/api/book", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      username: username.value,
      date: date.value,
      time: selectedTime
    })
  })
  .then(r => r.json())
  .then(() => alert("התור נקבע"));
}

function cancel() {
  fetch("/api/cancel", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      username: username.value,
      date: date.value,
      time: selectedTime
    })
  })
  .then(r => r.json())
  .then(() => alert("התור בוטל"));
}
</script>

</body>
</html>
