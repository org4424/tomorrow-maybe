<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ניהול – יובל</title>
<style>
body{font-family:Arial;background:#0b0f2a;color:white;padding:20px}
.card{background:#1c1f4a;padding:15px;border-radius:10px;margin-bottom:10px}
button{background:#e53935;color:white;border:none;padding:8px 12px;border-radius:6px}
</style>
</head>
<body>

<h1>מסך ניהול – יובל</h1>
<div id="list"></div>

<script>
async function load(){
  const res=await fetch("/api/admin/appointments")
  const data=await res.json()
  const list=document.getElementById("list")
  list.innerHTML=""

  data.forEach(a=>{
    const d=document.createElement("div")
    d.className="card"
    d.innerHTML=`
      <b>${a.name}</b><br>
      ${a.date} | ${a.time}<br><br>
      <button onclick="cancel(${a.id})">בטל תור</button>
    `
    list.appendChild(d)
  })
}

async function cancel(id){
  await fetch("/api/appointments/cancel",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id})
  })
  load()
}

load()
</script>

</body>
</html>
